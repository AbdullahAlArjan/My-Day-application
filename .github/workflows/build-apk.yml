name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java 21 (Required by Capacitor 8 & AGP)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rakpsmscsublxidtsoif.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_K5lcw7Ti68jg9UrfhONIxA_JnxMZkwx' }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-day-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "My Day Android APK (v1.0.0)"
          body: |
            ### 📱 My Day — Personal Daily Task Planner
            Direct download link for Android:
            Download **`app-debug.apk`** below directly to your Android device to install.
          files: android/app/build/outputs/apk/debug/app-debug.apk
